name: CD

# publica a imagem no GHCR e faz o deploy via Ansible quando algo entra na main
on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/http-server-projeto-korp

jobs:
  build-e-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem (tag = sha curto)
        uses: docker/build-push-action@v5
        with:
          context: ./http-server
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-e-push
    # roda no runner self-hosted (a própria EC2), deploy local sem SSH público
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Gera os segredos (.env e .htpasswd) a partir dos secrets
        run: |
          echo "GRAFANA_ADMIN_USER=admin" > .env
          echo "GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}" >> .env
          HASH=$(openssl passwd -apr1 "${{ secrets.PROMETHEUS_PASSWORD }}")
          echo "prom:$HASH" > nginx/.htpasswd

      - name: Escreve o inventory (deploy local)
        run: |
          echo "[all]" > ansible/inventory.ini
          echo "korp-server ansible_connection=local ansible_python_interpreter=/usr/bin/python3" >> ansible/inventory.ini

      - name: Sobe o ambiente no servidor
        working-directory: ansible
        run: sudo ansible-playbook -i inventory.ini playbook.yml
