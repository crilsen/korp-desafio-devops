# Loki em modo single-binary; chunks e índices persistem no S3.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

# Valores curtos para laboratório: tornam a persistência no S3 observável rapidamente.
ingester:
  chunk_idle_period: 30s
  max_chunk_age: 1m

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/index_cache
    cache_ttl: 24h
  aws:
    s3: s3://us-east-1/cn-korp-loki-logs-us-east-1

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h
